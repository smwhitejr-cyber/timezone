<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ART Time Zones</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* ── Base ── */
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      transition: background 0.3s;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 24px;
      padding: 28px 32px 32px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    /* ── Theme toggle ── */
    #theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
      padding: 0;
    }
    #theme-toggle:hover {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.36);
    }

    /* ── Analog clock strip ── */
    .clock-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(76px, 1fr));
      justify-items: center;
      align-items: start;
      margin-bottom: 22px;
      gap: 14px 6px;
    }

    .clock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }
    .clock-item svg { width: 80px; height: 80px; }

    .clock-face    { fill: rgba(255,255,255,0.06); }
    .clock-tick-major { stroke: rgba(255,255,255,0.5); }
    .clock-tick-minor { stroke: rgba(255,255,255,0.25); }
    .clock-hand-h  { stroke: #fff; transition: transform 0.4s cubic-bezier(0.4,2.1,0.6,1); }
    .clock-hand-m  { stroke: #fff; transition: transform 0.4s cubic-bezier(0.4,2.1,0.6,1); }

    .clock-flag {
      font-size: 14px;
      line-height: 1;
    }

    .clock-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: rgba(255,255,255,0.6);
    }

    .clock-digital {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: rgba(255,255,255,0.8);
      letter-spacing: 0.3px;
    }

    .clock-date {
      font-size: 10px;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
    }

    /* ── Headings ── */
    h2 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
      padding-right: 48px; /* clear theme toggle */
    }

    .muted {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.5;
    }
    .muted strong { color: rgba(255,255,255,0.75); }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 20px 0;
    }

    /* ── Input rows ── */
    .row {
      --accent: #4e9af1;
      display: grid;
      grid-template-columns: 120px 1fr 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
    }
    .row:first-of-type { margin-top: 0; }

    .zone-label {
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      min-width: 0;
    }
    .zone-name {
      color: var(--accent);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .flag { font-size: 18px; margin-right: 6px; }

    /* ── DST badge ── */
    .dst-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.5px;
      min-width: 28px;
      text-align: center;
    }

    /* ── Date/Time inputs ── */
    input[type="date"], input[type="time"] {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      font-size: 15px;
      font-family: inherit;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      color-scheme: dark;
    }
    .row input:focus {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }

    /* ── Per-row controls (move / remove) ── */
    .row-controls {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .row-btn {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .row-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.9);
      border-color: rgba(255,255,255,0.3);
    }
    .row-btn:disabled { opacity: 0.25; cursor: default; }
    .row-btn.remove:hover:not(:disabled) {
      color: #f87c52;
      border-color: rgba(248,124,82,0.5);
      background: rgba(248,124,82,0.12);
    }

    /* ── Add-zone control ── */
    .add-zone {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      align-items: center;
    }
    .add-zone input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      color-scheme: dark;
    }
    .add-zone input[type="text"]:focus {
      border-color: #4e9af1;
      background: rgba(78,154,241,0.12);
    }
    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.85);
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .pill-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.35);
    }
    .add-zone.hidden { display: none; }

    /* ── Footer ── */
    .footer-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    #reset-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.85);
      transition: background 0.2s, border-color 0.2s;
    }
    #reset-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.35);
    }

    kbd {
      font-size: 11px;
      font-family: inherit;
      padding: 3px 7px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.45);
    }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .card { padding: 20px 16px 24px; margin: 10px; border-radius: 16px; }
      h2 { font-size: 20px; }

      .clock-item svg { width: 62px; height: 62px; }
      .clock-digital { font-size: 10px; }

      .row {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "label    controls"
          "date     time";
        column-gap: 10px;
        row-gap: 8px;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid rgba(255,255,255,0.08);
      }
      .row:first-of-type { border-top: none; padding-top: 0; }
      .zone-label {
        grid-area: label;
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }
      .row :nth-child(2) { grid-area: date; }
      .row :nth-child(3) { grid-area: time; }
      .row-controls { grid-area: controls; justify-content: flex-end; align-self: center; }
      .row input[type="date"], .row input[type="time"] {
        padding: 9px 8px;
        font-size: 14px;
      }

      .add-zone { flex-wrap: wrap; }
      .add-zone input[type="text"] { flex: 1 1 100%; }

      body.light .row { border-top-color: rgba(0,0,0,0.08); }
    }

    /* ══════════════════════════════════════════
       LIGHT MODE
    ══════════════════════════════════════════ */
    body.light {
      background: linear-gradient(135deg, #dce8f5 0%, #e8f0fe 50%, #d4e4f7 100%);
    }
    body.light .card {
      background: rgba(255,255,255,0.88);
      border-color: rgba(0,0,0,0.1);
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }
    body.light #theme-toggle {
      border-color: rgba(0,0,0,0.18);
      background: rgba(0,0,0,0.05);
      color: rgba(0,0,0,0.65);
    }
    body.light #theme-toggle:hover {
      background: rgba(0,0,0,0.1);
    }
    body.light h2        { color: #1a1a2e; }
    body.light .muted    { color: rgba(0,0,0,0.5); }
    body.light .muted strong { color: rgba(0,0,0,0.72); }
    body.light .divider  { border-top-color: rgba(0,0,0,0.08); }
    body.light .zone-label { color: #1a1a2e; }
    body.light .dst-badge {
      background: rgba(0,0,0,0.08);
      color: rgba(0,0,0,0.52);
    }
    body.light input[type="date"],
    body.light input[type="time"],
    body.light .add-zone input[type="text"] {
      background: rgba(0,0,0,0.05);
      border-color: rgba(0,0,0,0.14);
      color: #1a1a2e;
      color-scheme: light;
    }
    body.light .row-btn {
      border-color: rgba(0,0,0,0.12);
      background: rgba(0,0,0,0.04);
      color: rgba(0,0,0,0.45);
    }
    body.light .row-btn:hover:not(:disabled) {
      background: rgba(0,0,0,0.1);
      color: rgba(0,0,0,0.8);
      border-color: rgba(0,0,0,0.25);
    }
    body.light .pill-btn,
    body.light #reset-btn {
      border-color: rgba(0,0,0,0.18);
      background: rgba(0,0,0,0.05);
      color: rgba(0,0,0,0.75);
    }
    body.light .pill-btn:hover,
    body.light #reset-btn:hover {
      background: rgba(0,0,0,0.1);
      border-color: rgba(0,0,0,0.28);
    }
    body.light kbd {
      border-color: rgba(0,0,0,0.18);
      background: rgba(0,0,0,0.05);
      color: rgba(0,0,0,0.38);
    }
    body.light .clock-label   { color: rgba(0,0,0,0.48); }
    body.light .clock-digital { color: rgba(0,0,0,0.72); }
    body.light .clock-date    { color: rgba(0,0,0,0.42); }
    body.light .clock-face    { fill: rgba(0,0,0,0.04); }
    body.light .clock-tick-major { stroke: rgba(0,0,0,0.38); }
    body.light .clock-tick-minor { stroke: rgba(0,0,0,0.18); }
    body.light .clock-hand-h  { stroke: #1a1a2e; }
    body.light .clock-hand-m  { stroke: #1a1a2e; }
  </style>
</head>
<body>
  <div class="card">

    <button id="theme-toggle" onclick="toggleTheme()" title="Toggle light / dark mode">☀</button>

    <!-- Analog clock strip -->
    <div class="clock-strip" id="clock-strip"></div>

    <h2>Time Zone Sync</h2>
    <div class="muted">
      Edit <strong>any</strong> field — the others update instantly. DST handled correctly.
      <br>Add your own zones below; your list and theme are saved in this browser.
    </div>

    <hr class="divider">

    <!-- Zone input rows are rendered here -->
    <div id="rows"></div>

    <!-- Add-zone control -->
    <div class="add-zone hidden" id="add-zone">
      <input type="text" id="tz-input" list="tz-list" placeholder="Search a city / IANA zone, e.g. Europe/London">
      <datalist id="tz-list"></datalist>
      <button class="pill-btn" onclick="confirmAddZone()">Add</button>
      <button class="pill-btn" onclick="toggleAddZone(false)">Cancel</button>
    </div>

    <div class="footer-row">
      <button id="reset-btn" onclick="resetToNow()">⟳ Reset to Current Time</button>
      <button class="pill-btn" onclick="toggleAddZone(true)">+ Add zone</button>
    </div>

  </div>

<script>
// ── Defaults & data model ───────────────────────────────────────────────────

const DEFAULT_ZONES = [
  { tz: "Australia/Sydney",   label: "Sydney",   color: "#a78bfa", flag: "🇦🇺" },
  { tz: "Australia/Brisbane", label: "Brisbane", color: "#52d18e", flag: "🇦🇺" },
  { tz: "Asia/Kolkata",       label: "India",    color: "#ff9933", flag: "🇮🇳" },
  { tz: "America/New_York",   label: "Eastern",  color: "#facc15", flag: "🇺🇸" },
  { tz: "America/Chicago",    label: "Central",  color: "#f87c52", flag: "🇺🇸" },
];

const PALETTE = [
  "#a78bfa", "#52d18e", "#ff9933", "#facc15", "#f87c52",
  "#4e9af1", "#f472b6", "#34d399", "#fb923c", "#c084fc",
  "#22d3ee", "#e879f9",
];

// Curated IANA-zone → flag emoji. Falls back to "" (no flag) when unknown.
const TZ_FLAG = {
  "Australia/Sydney": "🇦🇺", "Australia/Brisbane": "🇦🇺", "Australia/Melbourne": "🇦🇺",
  "Australia/Perth": "🇦🇺", "Australia/Adelaide": "🇦🇺",
  "Asia/Kolkata": "🇮🇳", "Asia/Tokyo": "🇯🇵", "Asia/Shanghai": "🇨🇳",
  "Asia/Hong_Kong": "🇭🇰", "Asia/Singapore": "🇸🇬", "Asia/Seoul": "🇰🇷",
  "Asia/Dubai": "🇦🇪", "Asia/Jakarta": "🇮🇩", "Asia/Bangkok": "🇹🇭",
  "Asia/Manila": "🇵🇭", "Asia/Karachi": "🇵🇰", "Asia/Jerusalem": "🇮🇱",
  "America/New_York": "🇺🇸", "America/Chicago": "🇺🇸", "America/Denver": "🇺🇸",
  "America/Los_Angeles": "🇺🇸", "America/Phoenix": "🇺🇸", "America/Anchorage": "🇺🇸",
  "Pacific/Honolulu": "🇺🇸",
  "America/Toronto": "🇨🇦", "America/Vancouver": "🇨🇦",
  "America/Mexico_City": "🇲🇽", "America/Sao_Paulo": "🇧🇷",
  "America/Argentina/Buenos_Aires": "🇦🇷", "America/Bogota": "🇨🇴",
  "Europe/London": "🇬🇧", "Europe/Dublin": "🇮🇪", "Europe/Paris": "🇫🇷",
  "Europe/Berlin": "🇩🇪", "Europe/Madrid": "🇪🇸", "Europe/Rome": "🇮🇹",
  "Europe/Amsterdam": "🇳🇱", "Europe/Brussels": "🇧🇪", "Europe/Zurich": "🇨🇭",
  "Europe/Stockholm": "🇸🇪", "Europe/Oslo": "🇳🇴", "Europe/Helsinki": "🇫🇮",
  "Europe/Warsaw": "🇵🇱", "Europe/Lisbon": "🇵🇹", "Europe/Athens": "🇬🇷",
  "Europe/Moscow": "🇷🇺", "Europe/Istanbul": "🇹🇷", "Europe/Kyiv": "🇺🇦",
  "Africa/Johannesburg": "🇿🇦", "Africa/Cairo": "🇪🇬", "Africa/Lagos": "🇳🇬",
  "Africa/Nairobi": "🇰🇪",
  "Pacific/Auckland": "🇳🇿",
};

const STORAGE_KEY = "tzsync.zones.v1";
const THEME_KEY   = "tzsync.theme";

const SVG_NS = "http://www.w3.org/2000/svg";
const R = 36, SZ = 80, CX = SZ / 2, CY = SZ / 2;

// Full IANA list for the picker (with a small fallback for old browsers).
const ALL_TZS = (typeof Intl.supportedValuesOf === "function")
  ? Intl.supportedValuesOf("timeZone")
  : DEFAULT_ZONES.map(z => z.tz).concat([
      "Europe/London", "Europe/Paris", "Europe/Berlin", "Asia/Tokyo",
      "Asia/Shanghai", "America/Los_Angeles", "Pacific/Auckland", "UTC",
    ]);

let zones = [];
let isSyncing = false;
let currentInstant = new Date();
let liveTimer = null;

function makeId() {
  return "z_" + Math.random().toString(36).slice(2, 9);
}

function defaultLabel(tz) {
  return tz.split("/").pop().replace(/_/g, " ");
}

function flagForTz(tz) {
  return TZ_FLAG[tz] || "";
}

function nextColor() {
  // Pick the palette color least used among the current zones.
  const counts = PALETTE.map(c => zones.filter(z => z.color === c).length);
  return PALETTE[counts.indexOf(Math.min(...counts))];
}

function isValidTz(tz) {
  try { new Intl.DateTimeFormat("en", { timeZone: tz }); return true; }
  catch { return false; }
}

// ── Persistence ──────────────────────────────────────────────────────────────

function seedDefaults() {
  return DEFAULT_ZONES.map(z => ({ ...z, id: makeId() }));
}

function save() {
  try {
    const data = {
      v: 1,
      zones: zones.map(({ id, tz, label, color, flag }) => ({ id, tz, label, color, flag })),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { /* private mode / quota — keep running in-memory */ }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return seedDefaults();
    const data = JSON.parse(raw);
    if (!data || data.v !== 1 || !Array.isArray(data.zones) || !data.zones.length)
      return seedDefaults();
    const valid = data.zones.filter(z => z && typeof z.tz === "string" && isValidTz(z.tz));
    if (!valid.length) return seedDefaults();
    return valid.map(z => ({
      id:    z.id || makeId(),
      tz:    z.tz,
      label: z.label || defaultLabel(z.tz),
      color: z.color || PALETTE[0],
      flag:  z.flag ?? flagForTz(z.tz),
    }));
  } catch (e) {
    return seedDefaults();
  }
}

// ── Pure time logic (DST-critical — unchanged) ───────────────────────────────

function partsInZone(date, tz) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: tz,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hour12: false
  }).formatToParts(date).reduce((a, p) => (a[p.type] = p.value, a), {});
  return {
    year: +parts.year, month: +parts.month, day: +parts.day,
    hour: +parts.hour, minute: +parts.minute, second: +parts.second
  };
}

function tzOffsetMs(tz, instant) {
  const z = partsInZone(instant, tz);
  const asUTC = Date.UTC(z.year, z.month - 1, z.day, z.hour, z.minute, z.second);
  return asUTC - instant.getTime();
}

function zonedWallTimeToInstant(dateStr, timeStr, tz) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const [hh, mm] = timeStr.split(":").map(Number);
  const guess = new Date(Date.UTC(y, m - 1, d, hh, mm, 0));
  const o1 = tzOffsetMs(tz, guess);
  let instant = new Date(guess.getTime() - o1);
  const o2 = tzOffsetMs(tz, instant);
  if (o2 !== o1) instant = new Date(guess.getTime() - o2);
  return instant;
}

function getTzAbbr(tz, instant) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: tz, timeZoneName: "short"
  }).formatToParts(instant);
  return parts.find(p => p.type === "timeZoneName")?.value ?? "";
}

// ── DOM builders ─────────────────────────────────────────────────────────────

function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function buildClock(z) {
  const wrap = document.createElement("div");
  wrap.className = "clock-item";

  const svg = svgEl("svg", { width: SZ, height: SZ, viewBox: `0 0 ${SZ} ${SZ}` });

  // Face
  svg.appendChild(svgEl("circle", {
    cx: CX, cy: CY, r: R,
    class: "clock-face",
    stroke: z.color, "stroke-width": "1.5"
  }));

  // Hour ticks
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * 2 * Math.PI;
    const inner = i % 3 === 0 ? R - 7 : R - 5;
    svg.appendChild(svgEl("line", {
      class: i % 3 === 0 ? "clock-tick-major" : "clock-tick-minor",
      x1: CX + inner * Math.sin(a),  y1: CY - inner * Math.cos(a),
      x2: CX + R     * Math.sin(a),  y2: CY - R     * Math.cos(a),
      "stroke-width": i % 3 === 0 ? "2" : "1",
      "stroke-linecap": "round"
    }));
  }

  // Hour hand
  z.handH = svgEl("line", {
    class: "clock-hand-h",
    x1: CX, y1: CY, x2: CX, y2: CY - 20,
    "stroke-width": "2.5", "stroke-linecap": "round"
  });
  svg.appendChild(z.handH);

  // Minute hand
  z.handM = svgEl("line", {
    class: "clock-hand-m",
    x1: CX, y1: CY, x2: CX, y2: CY - 28,
    "stroke-width": "1.5", "stroke-linecap": "round"
  });
  svg.appendChild(z.handM);

  // Second hand (accent colored)
  z.handS = svgEl("line", {
    x1: CX, y1: CY + 8, x2: CX, y2: CY - 31,
    stroke: z.color, "stroke-width": "1", "stroke-linecap": "round"
  });
  svg.appendChild(z.handS);

  // Center cap
  svg.appendChild(svgEl("circle", { cx: CX, cy: CY, r: "3", fill: z.color }));

  // Flag
  const flagEl = document.createElement("div");
  flagEl.className = "clock-flag";
  flagEl.textContent = z.flag;

  // Zone label
  const labelEl = document.createElement("div");
  labelEl.className = "clock-label";
  labelEl.textContent = z.label;
  labelEl.style.color = z.color;

  // Live digital readout
  z.digitalEl = document.createElement("div");
  z.digitalEl.className = "clock-digital";
  z.digitalEl.style.color = z.color;
  z.digitalEl.textContent = "–:––:––";

  // Date line
  z.dateLineEl = document.createElement("div");
  z.dateLineEl.className = "clock-date";
  z.dateLineEl.textContent = "––– ––– ––";

  wrap.appendChild(svg);
  wrap.appendChild(flagEl);
  wrap.appendChild(labelEl);
  wrap.appendChild(z.digitalEl);
  wrap.appendChild(z.dateLineEl);
  z.clockEl = wrap;
  return wrap;
}

function buildRow(z) {
  const row = document.createElement("div");
  row.className = "row";
  row.style.setProperty("--accent", z.color);

  // Label (flag + name) + DST badge
  const label = document.createElement("label");
  label.className = "zone-label";
  const nameLine = document.createElement("div");
  const flagSpan = document.createElement("span");
  flagSpan.className = "flag";
  flagSpan.textContent = z.flag;
  const nameSpan = document.createElement("span");
  nameSpan.className = "zone-name";
  nameSpan.textContent = z.label;
  nameSpan.title = z.tz;
  nameLine.appendChild(flagSpan);
  nameLine.appendChild(nameSpan);
  z.dstEl = document.createElement("span");
  z.dstEl.className = "dst-badge";
  label.appendChild(nameLine);
  label.appendChild(z.dstEl);

  // Date / time inputs
  z.dateEl = document.createElement("input");
  z.dateEl.type = "date";
  z.timeEl = document.createElement("input");
  z.timeEl.type = "time";
  z.dateEl.addEventListener("input", () => syncFrom(z));
  z.timeEl.addEventListener("input", () => syncFrom(z));

  // Controls (move up / down / remove)
  const controls = document.createElement("div");
  controls.className = "row-controls";
  const i = zones.indexOf(z);
  const upBtn = document.createElement("button");
  upBtn.className = "row-btn";
  upBtn.textContent = "▲";
  upBtn.title = "Move up";
  upBtn.disabled = i === 0;
  upBtn.addEventListener("click", () => moveZone(z.id, -1));
  const downBtn = document.createElement("button");
  downBtn.className = "row-btn";
  downBtn.textContent = "▼";
  downBtn.title = "Move down";
  downBtn.disabled = i === zones.length - 1;
  downBtn.addEventListener("click", () => moveZone(z.id, 1));
  const rmBtn = document.createElement("button");
  rmBtn.className = "row-btn remove";
  rmBtn.textContent = "✕";
  rmBtn.title = "Remove zone";
  rmBtn.disabled = zones.length <= 1;
  rmBtn.addEventListener("click", () => removeZone(z.id));
  controls.appendChild(upBtn);
  controls.appendChild(downBtn);
  controls.appendChild(rmBtn);

  row.appendChild(label);
  row.appendChild(z.dateEl);
  row.appendChild(z.timeEl);
  row.appendChild(controls);
  z.rowEl = row;
  return row;
}

// ── Render ───────────────────────────────────────────────────────────────────

function render() {
  const strip = document.getElementById("clock-strip");
  const rows  = document.getElementById("rows");
  strip.replaceChildren();
  rows.replaceChildren();
  zones.forEach(z => {
    strip.appendChild(buildClock(z));
    rows.appendChild(buildRow(z));
  });
  // Re-apply current instant to the freshly built DOM.
  isSyncing = true;
  zones.forEach(z => setInputs(z, currentInstant));
  isSyncing = false;
  updateClocksFromInstant(currentInstant);
}

// ── Clock hand + readout update ──────────────────────────────────────────────

function setHand(el, angleDeg) {
  if (el) el.setAttribute("transform", `rotate(${angleDeg}, ${CX}, ${CY})`);
}

function updateClocksFromInstant(instant) {
  zones.forEach(z => {
    const p = partsInZone(instant, z.tz);

    // Hands
    const hAngle = ((p.hour % 12) + p.minute / 60 + p.second / 3600) / 12 * 360;
    const mAngle = (p.minute + p.second / 60) / 60 * 360;
    const sAngle = p.second / 60 * 360;
    setHand(z.handH, hAngle);
    setHand(z.handM, mAngle);
    setHand(z.handS, sAngle);

    // Digital readout (12h AM/PM)
    if (z.digitalEl) {
      const hh12 = p.hour % 12 || 12;
      const ampm = p.hour < 12 ? "AM" : "PM";
      z.digitalEl.textContent =
        `${hh12}:${String(p.minute).padStart(2,"0")}:${String(p.second).padStart(2,"0")} ${ampm}`;
    }

    // Date line
    if (z.dateLineEl) {
      z.dateLineEl.textContent = new Intl.DateTimeFormat("en-US", {
        timeZone: z.tz,
        weekday: "short", month: "short", day: "numeric"
      }).format(instant);
    }

    // DST badge
    if (z.dstEl) z.dstEl.textContent = getTzAbbr(z.tz, instant);
  });
}

// ── Sync ─────────────────────────────────────────────────────────────────────

function setInputs(z, instant) {
  const p = partsInZone(instant, z.tz);
  z.dateEl.value =
    `${p.year.toString().padStart(4,"0")}-${String(p.month).padStart(2,"0")}-${String(p.day).padStart(2,"0")}`;
  z.timeEl.value =
    `${String(p.hour).padStart(2,"0")}:${String(p.minute).padStart(2,"0")}`;
}

function syncFrom(source) {
  if (isSyncing) return;
  isSyncing = true;
  stopLive();

  const dateVal = source.dateEl.value;
  const timeVal = source.timeEl.value;
  if (!dateVal || !timeVal) { isSyncing = false; return; }

  currentInstant = zonedWallTimeToInstant(dateVal, timeVal, source.tz);
  zones.forEach(z => { if (z !== source) setInputs(z, currentInstant); });
  updateClocksFromInstant(currentInstant);
  isSyncing = false;
}

// ── Live tick ────────────────────────────────────────────────────────────────

function startLive() {
  if (liveTimer) return;
  liveTimer = setInterval(() => {
    currentInstant = new Date();
    updateClocksFromInstant(currentInstant);
  }, 1000);
}

function stopLive() {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
}

// ── Zone management ──────────────────────────────────────────────────────────

function addZone(tz) {
  if (!isValidTz(tz)) return false;
  zones.push({
    id: makeId(),
    tz,
    label: defaultLabel(tz),
    color: nextColor(),
    flag: flagForTz(tz),
  });
  save();
  render();
  return true;
}

function removeZone(id) {
  if (zones.length <= 1) return;
  zones = zones.filter(z => z.id !== id);
  save();
  render();
}

function moveZone(id, dir) {
  const i = zones.findIndex(z => z.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= zones.length) return;
  [zones[i], zones[j]] = [zones[j], zones[i]];
  save();
  render();
}

// ── Add-zone UI ──────────────────────────────────────────────────────────────

function toggleAddZone(show) {
  const box = document.getElementById("add-zone");
  box.classList.toggle("hidden", !show);
  if (show) {
    const input = document.getElementById("tz-input");
    input.value = "";
    input.focus();
  }
}

function confirmAddZone() {
  const input = document.getElementById("tz-input");
  const tz = input.value.trim();
  if (addZone(tz)) {
    toggleAddZone(false);
  } else {
    input.focus();
    input.select();
  }
}

// ── Reset ────────────────────────────────────────────────────────────────────

function resetToNow() {
  currentInstant = new Date();
  isSyncing = true;
  zones.forEach(z => setInputs(z, currentInstant));
  isSyncing = false;
  updateClocksFromInstant(currentInstant);
  startLive();
}

// ── Keyboard shortcut: R ─────────────────────────────────────────────────────

document.addEventListener("keydown", e => {
  if ((e.key === "r" || e.key === "R") && document.activeElement.tagName !== "INPUT") {
    resetToNow();
  }
});

// ── Theme ────────────────────────────────────────────────────────────────────

function applyTheme(theme) {
  const light = theme === "light";
  document.body.classList.toggle("light", light);
  document.getElementById("theme-toggle").textContent = light ? "☾" : "☀";
}

function initTheme() {
  let theme = null;
  try { theme = localStorage.getItem(THEME_KEY); } catch {}
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  applyTheme(theme);
}

function toggleTheme() {
  const light = !document.body.classList.contains("light");
  applyTheme(light ? "light" : "dark");
  try { localStorage.setItem(THEME_KEY, light ? "light" : "dark"); } catch {}
}

// ── Init ─────────────────────────────────────────────────────────────────────

(function init() {
  // Populate the timezone picker datalist once.
  const list = document.getElementById("tz-list");
  const frag = document.createDocumentFragment();
  ALL_TZS.forEach(tz => {
    const opt = document.createElement("option");
    opt.value = tz;
    frag.appendChild(opt);
  });
  list.appendChild(frag);

  initTheme();
  zones = load();
  render();
  resetToNow();
})();
</script>
</body>
